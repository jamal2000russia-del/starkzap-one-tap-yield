<!-- زيد هاد السطر فـ <head> -->
<script src="https://cdn.jsdelivr.net/npm/starknet@5.24.3/dist/index.umd.js"></script>

<!-- هادو هما الأزرار الجداد -->
<button id="connectBtn" style="width:100%; background:#22c55e; color:white; padding:12px; border-radius:8px; font-weight:bold; border:none; margin-bottom:8px;" onclick="connectWallet()">CONNECT WALLET</button>
<div id="walletStatus" style="text-align:center; font-size:12px; color:#a1a1aa; margin-bottom:10px;">Not Connected</div>

<script>
async function connectWallet(){
  const status = document.getElementById('walletStatus');
  const btn = document.getElementById('connectBtn');
  try {
    status.innerText = "Requesting wallet...";
    // كيقلب على Wallet فالمتصفح - Ready / ArgentX / Braavos
    const starknet = window.starknet;
    if(!starknet){
      status.innerText = "❌ No wallet found. Open this site INSIDE Ready / ArgentX / Braavos app.";
      alert("حل هاد الموقع من داخل تطبيق Ready Wallet ولا ArgentX، ماشي من Chrome");
      return;
    }
    await starknet.enable();
    const address = starknet.selectedAddress || starknet.account?.address;
    if(address){
      const short = address.slice(0,6) + "..." + address.slice(-4);
      status.innerText = "✅ CONNECTED: " + short;
      btn.innerText = "CONNECTED: " + short;
      btn.style.background = "#18181b";
    } else {
      status.innerText = "Wallet found but no address. Try again.";
    }
  } catch(e){
    status.innerText = "❌ User rejected or error: " + e.message;
  }
}
</script>
