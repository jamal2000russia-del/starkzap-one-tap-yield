<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StarkZap - One Tap Yield</title>
<style>
  body { background: #0a0a0a; color: white; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; margin: 0; }
  .card { background: #18181b; border: 1px solid #27272a; padding: 24px; border-radius: 16px; width: 360px; }
  h2 { margin: 0 0 4px 0; }
  .apy { color: #22c55e; font-size: 13px; margin-bottom: 12px; }
  .risk { background: #292524; border: 1px solid #44403c; padding: 10px; border-radius: 8px; font-size: 11px; color: #d6d3d1; margin-bottom: 14px; line-height: 1.4; }
  select, input { width: 100%; background: #27272a; border: 1px solid #3f3f46; color: white; padding: 11px; border-radius: 8px; box-sizing: border-box; margin-bottom: 10px; }
  button { width: 100%; border: none; color: white; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
  .zap { background: #6d28d9; }
  .unzap { background: #18181b; border: 1px solid #52525b; }
  .status { margin-top: 10px; font-size: 12px; color: #a1a1aa; text-align: center; }
  .progress { height: 6px; background: #27272a; border-radius: 99px; overflow: hidden; margin-top: 8px; display: none; }
  .bar { height: 100%; width: 0%; background: #6d28d9; transition: width 0.5s; }
  .details { font-size: 12px; color: #a1a1aa; margin: 10px 0; line-height: 1.6; }
</style>
</head>
<body>
  <div class="card">
    <h2>⚡ StarkZap</h2>
    <div class="apy">Vesu APY: 8.42% • 1-Tap Yield on Starknet</div>

    <div class="risk">
      ⚠️ <b>Risk Disclosure:</b> Yield comes from Vesu lending market, APY is variable. Smart contract risk applies. Never deposit more than you can afford to lose.
    </div>

    <select id="asset">
      <option value="USDC">USDC → Vesu USDC Pool</option>
      <option value="ETH">ETH → Swap via AVNU → Vesu USDC</option>
      <option value="STRK">STRK → Swap via AVNU → Vesu USDC</option>
    </select>

    <input id="amount" type="number" value="10" placeholder="Amount">

    <div class="details" id="details">Fee (0.1%): 0.01 • Deposit: 9.99 • Est. Yield / Year: 0.84</div>

    <button class="zap" onclick="zap()">ZAP TO YIELD</button>
    <button class="unzap" onclick="unzap()">UN-ZAP • Withdraw</button>

    <div class="progress" id="progress"><div class="bar" id="bar"></div></div>
    <div class="status" id="status">Ready • Connected: 0x5608...8b87</div>
  </div>

<script>
const amountEl = document.getElementById('amount');
const detailsEl = document.getElementById('details');
function update(){
  const a = parseFloat(amountEl.value || 0);
  const fee = (a * 0.001).toFixed(2);
  const dep = (a - a*0.001).toFixed(2);
  const y = (dep * 0.0842).toFixed(2);
  detailsEl.innerText = `Fee (0.1%): ${fee} • Deposit: ${dep} • Est. Yield / Year: ${y}`;
}
amountEl.addEventListener('input', update); update();

function run(msg){
  const p = document.getElementById('progress');
  const b = document.getElementById('bar');
  const s = document.getElementById('status');
  p.style.display='block'; b.style.width='20%'; s.innerText='Preparing multicall...';
  setTimeout(()=>{ b.style.width='60%'; s.innerText='SENDING... Swapping via AVNU → Depositing to Vesu...'; }, 800);
  setTimeout(()=>{ b.style.width='100%'; s.innerText=msg; }, 1800);
}
function zap(){ const a = amountEl.value; const asset = document.getElementById('asset').value; run(`✅ Zapped! ${a} ${asset} → Vesu Yield`); }
function unzap(){ const a = amountEl.value; run(`✅ Un-Zapped! ${a} withdrawn to wallet. Fee 0.1% applied.`); }
</script>
</body>
</html>
